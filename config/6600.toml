# nokia-recomp per-target configuration — Nokia 6600 (NHL-10, GSM, 2003)
# DCT4 / UPP_WD2 (ARM920T), Symbian OS 7.0s, S60 2nd Edition.

[input]
# fw/NHL105530.C1 (WD2 container) -> 6600_mcu.bin (EKA1 flash, 0x50000000)
container = "fw/NHL105530.C1"
image     = "6600_mcu.bin"
kernel    = "fw/6600_kernel.bin"
source    = "NHL105530.C1 (NHL-10 v5.53.0, WD2 BT2 / WD2 ALGORITHM)"
cpu       = "armv4t"

[platform]
family = "DCT4"
asic   = "UPP_WD2"                 # 104 MHz ARM920T
ui     = "S60 2nd Edition (Symbian OS 7.0s)"

[memory]
rom_base      = 0x50000000         # EKA1 ROM link address
rom_size      = 0x01600000         # declared 22 MiB
ram_base      = 0x80000000         # kernel data/RAM
ram_size      = 0x00300000         # 3 MiB; NK_RAM_EXTRA extends to 6 MiB
superpage     = 0x40000000         # mask-ROM hand-off page
high_vectors  = 0xffff0000

[rom]
# Offsets are in the page-header-free packed stream (pagestream.py build).
header_offset    = 0x7c            # 6600 EKA1 TRomHeader starts at +0x7c
root_dir_list    = 0x50300000      # iRomRootDirectoryList (runtime VA)
kernel_header    = 0x31004c        # TRomImageHeader in the stream
kernel_text      = 0x3100b0        # header + 0x64
kernel_header_va = 0x5030ff9c      # flat runtime VA (code - 0x64)
kernel_code      = 0x50310000
kernel_entry     = 0x50310054      # ARM
kernel_data      = 0x50338ac0      # ROM copy of .data; also copied to RAM
kernel_data_size = 0x500
kernel_bss       = 0x1c58
kernel_stack     = 0x4000          # iStackSize
kernel_heap_min  = 0x20000         # iHeapSizeMin
kernel_heap_max  = 0x1000000       # iHeapSizeMax
runtime_image    = "out/6600_runtime.bin"

[romfs]
# Directory block is read in place at 0x50300000.
root_list_file = 0x3000b0          # stream offset of the root list
root_list_va   = 0x50300000
dir_span       = 0x10000
libs_entries   = 586               # boot image table
programs_entries = 55              # server list
plugins_entries = 171              # \System\Libs\Plugins

[display]
width  = 176
height = 208
color  = true                      # 176x208 16-bit TFT

[boot]
# Current acceptance profile (see tools/test_round30.sh).
import_map   = "config/imports-r29-6600.txt"
callmap      = "config/callmap-rtc-6600.txt"
system_time  = true                # mask-ROM TTime hand-off at 0x50000084
boot_handoff = true
primary_ram  = 0x80900000
hal_timer_hz = 4
timer        = true                # round 30: UPP timer/ICU model (NK_TIMER)
irq_cpsr     = 0x40000053          # mask-ROM I=0 hand-off (NK_CPSR)

[output]
dir     = "out/"
context = "n6600_cpu_t"

[functions]
# entry = 0x50310054               # kernel entry (ARM)
# hints = []
